services:
  postgres:
    image: postgres:18
    container_name: lanedesk-postgres
    environment:
      POSTGRES_DB: lanedesk
      POSTGRES_USER: lanedesk
      POSTGRES_PASSWORD: ${LANEDESK_DB_PASSWORD:?set LANEDESK_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - lanedesk-pgdata:/var/lib/postgresql

volumes:
  lanedesk-pgdata:
