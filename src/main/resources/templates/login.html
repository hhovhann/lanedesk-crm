<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="login-page">
<div class="card login">
  <h1>🚚 LaneDesk</h1>
  <p class="tag">Your freight sales desk</p>
  <div class="flash error" th:if="${param.error}">Wrong username or password.</div>
  <div class="flash message" th:if="${param.logout}">Signed out.</div>
  <form method="post" th:action="@{/login}">
    <label>Username</label><input name="username" autofocus required>
    <label>Password</label><input name="password" type="password" required>
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
